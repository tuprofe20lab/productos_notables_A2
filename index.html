<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TuProfe20 Lab - Productos notables</title>
    
    <script src="https://cdn.tailwindcss.com"></script>
    <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    
    <!-- KaTeX -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.css">
    <script src="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.js"></script>
    
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Nunito:wght@400;700;900&display=swap');
        
        body { margin: 0; padding: 0; overflow: hidden; width: 100vw; height: 100dvh; user-select: none; }
        .font-fun { font-family: 'Nunito', sans-serif; }
        
        @keyframes floatUp { 
            0% { transform: translateY(105vh) rotate(0deg); } 
            100% { transform: translateY(-105vh) rotate(360deg); } 
        }
        @keyframes slideInRight { 
            0% { opacity: 0; transform: translateX(20px); } 
            100% { opacity: 1; transform: translateX(0); } 
        }
        @keyframes confettiExplosion { 
            0% { transform: translate(0, 0) scale(1) rotate(0deg); opacity: 1; } 
            80% { opacity: 1; } 
            100% { transform: translate(var(--tx), var(--ty)) scale(0) rotate(var(--rot)); opacity: 0; } 
        }
        @keyframes jellyPop {
            0% { transform: scale3d(.3, .3, .3); opacity: 0; }
            20% { transform: scale3d(1.18, 1.18, 1.18); }
            40% { transform: scale3d(.92, .92, .92); }
            60% { transform: scale3d(1.06, 1.06, 1.06); opacity: 1; }
            80% { transform: scale3d(.97, .97, .97); }
            100% { transform: scale3d(1, 1, 1); opacity: 1; }
        }
        @keyframes robotFloat { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-6px); } }
        @keyframes robotThinkTilt { 0%, 100% { transform: rotate(0deg); } 50% { transform: rotate(6deg) translateY(-3px); } }
        @keyframes robotJump { 0%, 100% { transform: translateY(0); } 30% { transform: translateY(-15px); } }
        @keyframes robotTalkArmL { 0%, 100% { transform: rotate(45deg); } 50% { transform: rotate(95deg); } }
        @keyframes robotTalkArmR { 0%, 100% { transform: rotate(-45deg); } 50% { transform: rotate(-95deg); } }

        .scrollbar-hide::-webkit-scrollbar { display: none; }
        .scrollbar-hide { -ms-overflow-style: none; scrollbar-width: none; }

        .animate-floatUp { animation: floatUp linear infinite; }
        .animate-slideInRight { animation: slideInRight 0.3s ease-out forwards; }
        .animate-confettiExplosion { animation: confettiExplosion 1.8s cubic-bezier(0.25, 1, 0.5, 1) forwards; }
        .animate-jellyPop { animation: jellyPop 0.55s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards; }
        .animate-robotFloat { animation: robotFloat 3s ease-in-out infinite; }
        .animate-robotThinkTilt { animation: robotThinkTilt 2s ease-in-out infinite; }
        .animate-robotJump { animation: robotJump 1s cubic-bezier(0.28, 0.84, 0.42, 1) infinite; }
        .animate-robotTalkArmL { animation: robotTalkArmL 0.6s ease-in-out infinite; }
        .animate-robotTalkArmR { animation: robotTalkArmR 0.6s ease-in-out infinite 0.1s; }

        .katex { font-weight: 900 !important; }
        .katex-display { margin: 0 !important; padding: 0 !important; }
        
        .math-card .katex { font-size: clamp(0.9rem, 1.8vw, 1.3rem) !important; color: #1e293b !important; }
        .math-enunciado .katex { font-size: clamp(1rem, 2.2vw, 1.6rem) !important; color: #ffffff !important; }
        .math-current .katex { font-size: clamp(1.1rem, 2.8vw, 2.3rem) !important; color: #0f172a !important; }
        .math-history .katex { font-size: clamp(0.9rem, 2vw, 1.5rem) !important; color: #475569 !important; }
    </style>
</head>
<body class="bg-slate-950 font-fun">
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect, useRef, memo } = React;

        const Icon = ({ paths, className = "", size = 24, fill = "none", strokeWidth = "2.5" }) => (
            <svg xmlns="http://www.w3.org/2000/svg" width={size} height={size} viewBox="0 0 24 24" fill={fill} stroke="currentColor" strokeWidth={strokeWidth} strokeLinecap="round" strokeLinejoin="round" className={className} dangerouslySetInnerHTML={{__html: paths}} />
        );

        const VolumeX = (p) => <Icon {...p} paths='<polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"/><line x1="23" y1="9" x2="17" y2="15"/><line x1="17" y1="9" x2="23" y2="15"/>' />;
        const Volume2 = (p) => <Icon {...p} paths='<polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"/><path d="M15.54 8.46a5 5 0 0 1 0 7.07"/><path d="M19.07 4.93a10 10 0 0 1 0 14.14"/>' />;
        const Rocket = (p) => <Icon {...p} paths='<path d="M4.5 16.5c-1.5 1.26-2 5-2 5s3.74-.5 5-2c.71-.84.7-2.13-.09-2.91a2.18 2.18 0 0 0-2.91-.09z"/><path d="m12 15-3-3a22 22 0 0 1 2-3.95A12.88 12.88 0 0 1 22 2c0 2.72-.78 7.5-6 11a22.35 22.35 0 0 1-4 2z"/><path d="M9 12H4s.55-3.03 2-4c1.62-1.08 5 0 5 0"/><path d="M12 15v5s3.03-.55 4-2c1.08-1.62 0-5 0-5"/>' />;
        const Sparkles = (p) => <Icon {...p} paths='<path d="m12 3-1.912 5.813a2 2 0 0 1-1.275 1.275L3 12l5.813 1.912a2 2 0 0 1 1.275 1.275L12 21l1.912-5.813a2 2 0 0 1 1.275-1.275L21 12l-5.813-1.912a2 2 0 0 1-1.275-1.275L12 3Z"/><path d="M5 3v4"/><path d="M3 5h4"/><path d="M19 3v4"/><path d="M17 5h4"/>' />;
        const Home = (p) => <Icon {...p} paths='<path d="m3 9 9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/><polyline points="9 22 9 12 15 12 15 22"/>' />;
        const ChevronLeft = (p) => <Icon {...p} paths='<polyline points="15 18 9 12 15 6"/>' />;
        const ChevronRight = (p) => <Icon {...p} paths='<polyline points="9 18 15 12 9 6"/>' />;
        const HelpCircle = (p) => <Icon {...p} paths='<circle cx="12" cy="12" r="10"/><path d="M9.09 9a3 3 0 0 1 5.83 1c0 2-3 3-3 3"/><line x1="12" y1="17" x2="12.01" y2="17"/>' />;

        const AudioController = {
            ctx: null, muted: false,
            init: function() {
                if (this.ctx) return;
                const AudioContext = window.AudioContext || window.webkitAudioContext;
                if (AudioContext) this.ctx = new AudioContext();
            },
            play: function(type) {
                if (this.muted || !this.ctx) return;
                if (this.ctx.state === 'suspended') this.ctx.resume();
                const osc = this.ctx.createOscillator();
                const gain = this.ctx.createGain();
                osc.connect(gain); gain.connect(this.ctx.destination);
                const now = this.ctx.currentTime;
                
                if (type === 'pop') {
                    osc.type = 'sine'; osc.frequency.setValueAtTime(500, now); osc.frequency.exponentialRampToValueAtTime(800, now + 0.1);
                    gain.gain.setValueAtTime(0.25, now); gain.gain.exponentialRampToValueAtTime(0.01, now + 0.1);
                    osc.start(now); osc.stop(now + 0.1);
                } else if (type === 'pop-reverse') {
                    osc.type = 'triangle'; osc.frequency.setValueAtTime(650, now); osc.frequency.exponentialRampToValueAtTime(280, now + 0.12);
                    gain.gain.setValueAtTime(0.2, now); gain.gain.exponentialRampToValueAtTime(0.01, now + 0.12);
                    osc.start(now); osc.stop(now + 0.12);
                } else if (type === 'success') {
                    osc.disconnect();
                    const notes = [523.25, 659.25, 783.99, 1046.50];
                    notes.forEach((freq, i) => {
                        const o = this.ctx.createOscillator(); const g = this.ctx.createGain();
                        o.type = 'triangle'; o.frequency.value = freq;
                        o.connect(g); g.connect(this.ctx.destination);
                        const startTime = now + (i * 0.07);
                        g.gain.setValueAtTime(0, startTime); g.gain.linearRampToValueAtTime(0.2, startTime + 0.04); g.gain.linearRampToValueAtTime(0, startTime + 0.35);
                        o.start(startTime); o.stop(startTime + 0.35);
                    });
                } else if (type === 'swoosh') {
                    osc.type = 'sine'; osc.frequency.setValueAtTime(280, now); osc.frequency.exponentialRampToValueAtTime(70, now + 0.18);
                    gain.gain.setValueAtTime(0.2, now); gain.gain.linearRampToValueAtTime(0.01, now + 0.18);
                    osc.start(now); osc.stop(now + 0.18);
                }
            },
            toggleMute: function() { this.muted = !this.muted; return this.muted; }
        };

        const MathDisplay = memo(({ latex, className = "", inline = false }) => {
            const containerRef = useRef(null);

            useEffect(() => {
                if (containerRef.current && window.katex) {
                    try {
                        window.katex.render(latex, containerRef.current, {
                            displayMode: !inline, throwOnError: false, strict: false, trust: true
                        });
                    } catch (e) {
                        containerRef.current.innerText = latex;
                    }
                }
            }, [latex, inline]);

            return inline ? (
                <span ref={containerRef} className={`inline-block align-middle ${className}`} />
            ) : (
                <div className={`relative w-full flex justify-center ${className}`}>
                    <div ref={containerRef} className="w-full text-center" />
                </div>
            );
        });

        // Tarjeta interactiva para la fórmula y ayuda desplegable
        const InteractiveFormula = memo(({ title, latex, hint }) => {
            const [showHint, setShowHint] = useState(false);

            return (
                <div 
                    onClick={() => setShowHint(!showHint)}
                    className="bg-gradient-to-r from-indigo-50 to-blue-50 border-2 border-indigo-200 hover:border-indigo-400 rounded-2xl p-4 text-center shadow-md my-2 cursor-pointer transition-all hover:scale-[1.02] active:scale-98 relative group"
                >
                    <div className="flex items-center justify-center gap-2 mb-1">
                        <span className="text-xs font-black tracking-widest text-indigo-700 uppercase">{title}</span>
                        <HelpCircle className="w-4 h-4 text-indigo-500 group-hover:rotate-12 transition-transform" />
                    </div>
                    <div className="math-card py-1">
                        <MathDisplay latex={latex} />
                    </div>
                    {showHint && hint && (
                        <div className="mt-3 text-xs sm:text-sm font-bold text-indigo-900 bg-white/90 p-2.5 rounded-xl border border-indigo-200 animate-jellyPop shadow-sm">
                            💡 <MathDisplay inline latex={hint} />
                        </div>
                    )}
                    <span className="text-[10px] text-indigo-400 font-bold block mt-1">Haz clic para ver la regla</span>
                </div>
            );
        });

        const EXERCISES = [
            {
                id: 1, title: "Ejercicio 1", subtitle: "Suma al Cuadrado Básica",
                cardGradient: "from-blue-500/30 to-cyan-600/30 border-blue-400", badgeColor: "bg-blue-500",
                enunciado: () => <span>Efectuar directamente:<br/><MathDisplay inline latex="(x + 2)^2" /></span>,
                steps: [
                    { 
                        latex: String.raw`(a+b)^2 = a^2 + 2ab + b^2`, 
                        propertyText: "1. Recordando la Identidad", 
                        robotSpeech: "Para elevar un binomio al cuadrado, usamos el cuadrado del primero, más el doble producto del primero por el segundo, más el cuadrado del segundo.",
                        graphic: <InteractiveFormula title="Binomio Suma al Cuadrado" latex="(a+b)^2 = a^2 + 2ab + b^2" hint="\text{Identificamos } a=x \text{ y } b=2" />
                    },
                    { 
                        latex: String.raw`a = x \quad \text{y} \quad b = 2`, 
                        propertyText: "2. Identificando Términos", 
                        robotSpeech: "Identificamos claramente cada término: 'x' toma el rol del primer término (a) y '2' el del segundo término (b)." 
                    },
                    { 
                        latex: String.raw`(x+2)^2 = (x)^2 + 2(x)(2) + (2)^2`, 
                        propertyText: "3. Reemplazo de los Términos", 
                        robotSpeech: "Reemplazamos en la regla: el primer término al cuadrado (x)², más el doble del primero por el segundo 2(x)(2), más el segundo al cuadrado (2)²." 
                    },
                    { 
                        latex: String.raw`(x+2)^2 = x^2 + (2 \cdot 2 \cdot x) + 4`, 
                        propertyText: "4. Multiplicación de Coeficientes", 
                        robotSpeech: "Efectuamos las potencias y agrupamos la multiplicación de coeficientes en el término central: 2 por 2 es igual a 4." 
                    },
                    { 
                        latex: String.raw`(x+2)^2 = \mathbf{x^2 + 4x + 4}`, 
                        propertyText: "5. Trinomio Cuadrado Perfecto Final", 
                        robotSpeech: "¡Resultado final obtenido! El binomio desplegado da como resultado el trinomio x² + 4x + 4." 
                    }
                ]
            },
            {
                id: 2, title: "Ejercicio 2", subtitle: "Suma al Cuadrado con Coeficiente",
                cardGradient: "from-indigo-500/30 to-blue-600/30 border-indigo-400", badgeColor: "bg-indigo-500",
                enunciado: () => <span>Efectuar directamente:<br/><MathDisplay inline latex="(3x + 6)^2" /></span>,
                steps: [
                    { 
                        latex: String.raw`(a+b)^2 = a^2 + 2ab + b^2`, 
                        propertyText: "1. Aplicando la Identidad", 
                        robotSpeech: "Usaremos la fórmula del binomio suma al cuadrado para desplegar todos sus términos.",
                        graphic: <InteractiveFormula title="Binomio al Cuadrado" latex="(a+b)^2 = a^2 + 2ab + b^2" hint="\text{En este caso } a=3x \text{ y } b=6" />
                    },
                    { 
                        latex: String.raw`a = 3x \quad \text{y} \quad b = 6`, 
                        propertyText: "2. Asignación de Valores", 
                        robotSpeech: "El primer término 'a' es todo el bloque (3x) y el segundo término 'b' es 6." 
                    },
                    { 
                        latex: String.raw`(3x+6)^2 = (3x)^2 + 2(3x)(6) + (6)^2`, 
                        propertyText: "3. Planteamiento del Desarrollo", 
                        robotSpeech: "Reemplazamos con paréntesis: (3x)², luego 2·(3x)·(6) para el término central, y (6)²." 
                    },
                    { 
                        latex: String.raw`(3x+6)^2 = (3^2 \cdot x^2) + (2 \cdot 3 \cdot 6 \cdot x) + 36`, 
                        propertyText: "4. Desarrollando Potencias y Productos", 
                        robotSpeech: "Elevamos al cuadrado tanto el 3 como la x: 3² = 9. Luego multiplicamos los números del término central: 2·3·6 = 36." 
                    },
                    { 
                        latex: String.raw`(3x+6)^2 = \mathbf{9x^2 + 36x + 36}`, 
                        propertyText: "5. Resultado Final Reducido", 
                        robotSpeech: "¡Excelente! El desarrollo completo da como resultado 9x² + 36x + 36." 
                    }
                ]
            },
            {
                id: 3, title: "Ejercicio 3", subtitle: "Resta al Cuadrado Básica",
                cardGradient: "from-purple-500/30 to-fuchsia-600/30 border-purple-400", badgeColor: "bg-purple-500",
                enunciado: () => <span>Efectuar directamente:<br/><MathDisplay inline latex="(x - 3)^2" /></span>,
                steps: [
                    { 
                        latex: String.raw`(a-b)^2 = a^2 - 2ab + b^2`, 
                        propertyText: "1. Regla del Binomio Diferencia", 
                        robotSpeech: "Atención al signo negativo: en la resta al cuadrado, únicamente el término del doble producto lleva el signo menos.",
                        graphic: <InteractiveFormula title="Binomio Diferencia al Cuadrado" latex="(a-b)^2 = a^2 - 2ab + b^2" hint="\text{El doble producto es negativo: } -2ab" />
                    },
                    { 
                        latex: String.raw`a = x \quad \text{y} \quad b = 3`, 
                        propertyText: "2. Identificando a y b", 
                        robotSpeech: "Tomamos a = x y b = 3 para sustituir en el patrón algebraico." 
                    },
                    { 
                        latex: String.raw`(x-3)^2 = (x)^2 - 2(x)(3) + (3)^2`, 
                        propertyText: "3. Reemplazo del Binomio", 
                        robotSpeech: "Planteamos la suma y resta de componentes: (x)² - 2(x)(3) + (3)²." 
                    },
                    { 
                        latex: String.raw`(x-3)^2 = x^2 - (2 \cdot 3)x + 9`, 
                        propertyText: "4. Multiplicación de Coeficientes", 
                        robotSpeech: "Multiplicamos 2 por 3 en el término del medio obteniendo -6x, y calculamos 3² que da 9." 
                    },
                    { 
                        latex: String.raw`(x-3)^2 = \mathbf{x^2 - 6x + 9}`, 
                        propertyText: "5. Resultado Simplificado", 
                        robotSpeech: "¡Completado! La respuesta final simplificada es x² - 6x + 9." 
                    }
                ]
            },
            {
                id: 4, title: "Ejercicio 4", subtitle: "Resta al Cuadrado Compleja",
                cardGradient: "from-pink-500/30 to-rose-600/30 border-pink-400", badgeColor: "bg-pink-500",
                enunciado: () => <span>Efectuar directamente:<br/><MathDisplay inline latex="(2x - 5)^2" /></span>,
                steps: [
                    { 
                        latex: String.raw`(a-b)^2 = a^2 - 2ab + b^2`, 
                        propertyText: "1. Fórmula General", 
                        robotSpeech: "Usaremos la diferencia al cuadrado para evitar errores con los coeficientes.",
                        graphic: <InteractiveFormula title="Diferencia al Cuadrado" latex="(a-b)^2 = a^2 - 2ab + b^2" hint="a=2x \text{ y } b=5" />
                    },
                    { 
                        latex: String.raw`a = 2x \quad \text{y} \quad b = 5`, 
                        propertyText: "2. Identificación de Componentes", 
                        robotSpeech: "Notamos que 'a' corresponde al término compuesto (2x) y 'b' es la constante 5." 
                    },
                    { 
                        latex: String.raw`(2x-5)^2 = (2x)^2 - 2(2x)(5) + (5)^2`, 
                        propertyText: "3. Planteamiento del Desarrollo", 
                        robotSpeech: "Escribimos explícitamente: (2x)² - 2(2x)(5) + (5)²." 
                    },
                    { 
                        latex: String.raw`(2x-5)^2 = (2^2 \cdot x^2) - (2 \cdot 2 \cdot 5 \cdot x) + 25`, 
                        propertyText: "4. Resolviendo cada Parte", 
                        robotSpeech: "Elevamos (2)² = 4, calculamos la multiplicación central 2·2·5 = 20 y elevamos 5² = 25." 
                    },
                    { 
                        latex: String.raw`(2x-5)^2 = \mathbf{4x^2 - 20x + 25}`, 
                        propertyText: "5. Trinomio Resultante", 
                        robotSpeech: "¡Resuelto paso a paso! La respuesta es 4x² - 20x + 25." 
                    }
                ]
            },
            {
                id: 5, title: "Ejercicio 5", subtitle: "Binomio con Fracción 1/2",
                cardGradient: "from-amber-500/30 to-orange-600/30 border-amber-400", badgeColor: "bg-amber-500",
                enunciado: () => <span>Efectuar directamente:<br/><MathDisplay inline latex="\left(2x + \frac{1}{2}\right)^2" /></span>,
                steps: [
                    { 
                        latex: String.raw`(a+b)^2 = a^2 + 2ab + b^2`, 
                        propertyText: "1. Fórmula del Binomio", 
                        robotSpeech: "Aplicamos la regla del binomio suma para expresiones que contienen números fraccionarios.",
                        graphic: <InteractiveFormula title="Fracciones al Cuadrado" latex="\left(\frac{1}{2}\right)^2 = \frac{1^2}{2^2} = \frac{1}{4}" hint="\text{Elevar la fracción afecta a numerador y denominador}" />
                    },
                    { 
                        latex: String.raw`a = 2x \quad \text{y} \quad b = \frac{1}{2}`, 
                        propertyText: "2. Identificación Término por Término", 
                        robotSpeech: "Primer término a = 2x, segundo término b = 1/2." 
                    },
                    { 
                        latex: String.raw`\left(2x+\frac{1}{2}\right)^2 = (2x)^2 + 2(2x)\left(\frac{1}{2}\right) + \left(\frac{1}{2}\right)^2`, 
                        propertyText: "3. Reemplazo Explícito", 
                        robotSpeech: "Reemplazamos: (2x)² + 2·(2x)·(1/2) + (1/2)²." 
                    },
                    { 
                        latex: String.raw`\left(2x+\frac{1}{2}\right)^2 = 4x^2 + \left(\frac{2 \cdot 2x \cdot 1}{2}\right) + \frac{1}{4}`, 
                        propertyText: "4. Simplificación del Término Central", 
                        robotSpeech: "En el término del medio 2·(2x)·(1/2), cancelamos el factor 2 que multiplica con el 2 que divide." 
                    },
                    { 
                        latex: String.raw`\left(2x+\frac{1}{2}\right)^2 = \mathbf{4x^2 + 2x + \frac{1}{4}}`, 
                        propertyText: "5. Resultado Final", 
                        robotSpeech: "¡Listo! Obtenemos el trinomio simplificado 4x² + 2x + 1/4." 
                    }
                ]
            },
            {
                id: 6, title: "Ejercicio 6", subtitle: "Binomio con Coeficiente 3 y Fracción",
                cardGradient: "from-lime-500/30 to-green-600/30 border-lime-400", badgeColor: "bg-lime-500",
                enunciado: () => <span>Efectuar directamente:<br/><MathDisplay inline latex="\left(3x + \frac{1}{2}\right)^2" /></span>,
                steps: [
                    { 
                        latex: String.raw`(a+b)^2 = a^2 + 2ab + b^2`, 
                        propertyText: "1. Regla Básica", 
                        robotSpeech: "Desplegamos según el patrón del binomio al cuadrado.",
                        graphic: <InteractiveFormula title="Multiplicación de Fracciones" latex="2 \cdot (3x) \cdot \frac{1}{2} = \frac{6x}{2} = 3x" hint="\text{Cancelación directa del 2}" />
                    },
                    { 
                        latex: String.raw`a = 3x \quad \text{y} \quad b = \frac{1}{2}`, 
                        propertyText: "2. Asignación de Términos", 
                        robotSpeech: "Definimos a = 3x para el primer término y b = 1/2 para el segundo." 
                    },
                    { 
                        latex: String.raw`\left(3x+\frac{1}{2}\right)^2 = (3x)^2 + 2(3x)\left(\frac{1}{2}\right) + \left(\frac{1}{2}\right)^2`, 
                        propertyText: "3. Planteamiento", 
                        robotSpeech: "Escribimos todo la estructura: (3x)² + 2(3x)(1/2) + (1/2)²." 
                    },
                    { 
                        latex: String.raw`\left(3x+\frac{1}{2}\right)^2 = 9x^2 + \left(2 \cdot \frac{1}{2}\right)(3x) + \frac{1}{4}`, 
                        propertyText: "4. Operaciones Término a Término", 
                        robotSpeech: "3² = 9x². Multiplicamos 2 por 1/2 que resulta 1, dejando únicamente 3x en el centro." 
                    },
                    { 
                        latex: String.raw`\left(3x+\frac{1}{2}\right)^2 = \mathbf{9x^2 + 3x + \frac{1}{4}}`, 
                        propertyText: "5. Expresión Final", 
                        robotSpeech: "¡Perfecto! La expresión totalmente reducida es 9x² + 3x + 1/4." 
                    }
                ]
            },
            {
                id: 7, title: "Ejercicio 7", subtitle: "Fracción de Denominador 7",

                            ))}
                        </div>

                        <button onClick={toggleMute} className="p-2 sm:p-3 rounded-[1rem] sm:rounded-[1.2rem] bg-white/10 border-[3px] border-white/30 text-white hover:bg-white/20 transition-all shadow-lg active:scale-95 hover:scale-105">
                            {isMuted ? <VolumeX className="w-5 h-5 sm:w-6 sm:h-6" /> : <Volume2 className="w-5 h-5 sm:w-6 sm:h-6" />}
                        </button>
                    </div>

                    <div className="flex-1 min-h-0 relative z-10 w-[96%] max-w-[1400px] mx-auto bg-white rounded-[2rem] sm:rounded-[2.5rem] border-[6px] sm:border-[8px] border-slate-100 shadow-[0_30px_60px_rgba(0,0,0,0.5)] flex flex-col overflow-hidden">
                        
                        {/* Enunciado Area */}
                        <div className="shrink-0 bg-slate-900 border-b-[4px] border-blue-500 px-4 py-3 sm:px-6 flex flex-col justify-center relative shadow-md z-20">
                            <div className="flex justify-between items-center w-full max-w-5xl mx-auto mb-2">
                                <span className="bg-yellow-400 text-slate-900 font-black text-xs sm:text-sm px-3 py-1 rounded-md uppercase tracking-widest shadow-sm">
                                    {currentExercise.title}
                                </span>
                                <span className="text-cyan-200 font-bold text-xs sm:text-sm bg-white/10 px-3 py-1 rounded-md">
                                    {currentExercise.subtitle}
                                </span>
                            </div>
                            <div className="flex flex-col items-center justify-center text-white font-bold text-lg sm:text-xl md:text-2xl text-center w-full max-w-5xl mx-auto leading-relaxed math-enunciado">
                                <EnunciadoText />
                            </div>
                        </div>

                        {/* Desarrollo Contínuo */}
                        <div className="flex-1 flex flex-col items-center p-4 sm:p-6 relative bg-slate-50 overflow-hidden w-full">
                            <div className="absolute inset-0 opacity-[0.03] bg-[radial-gradient(#000_2px,transparent_2px)] [background-size:20px_20px] pointer-events-none"></div>

                            {/* Badge actual arriba flotando */}
                            <div key={`badge-${exIdx}-${step}`} className="z-20 mb-4 animate-jellyPop text-center shrink-0">
                                <span className={`inline-flex items-center gap-2 sm:gap-3 px-5 py-2 sm:px-6 sm:py-2.5 rounded-[1rem] font-black text-sm sm:text-lg lg:text-xl shadow-lg border-2 ${step === maxSteps ? 'bg-amber-400 text-slate-900 border-yellow-200' : 'bg-gradient-to-r from-blue-600 to-indigo-600 text-white border-blue-400'}`}>
                                    <Sparkles className="w-5 h-5 sm:w-6 sm:h-6" /> 
                                    <span>{currentStepData.propertyText}</span>
                                </span>
                            </div>

                            {/* Contenedor escrolleable */}
                            <div ref={scrollContainerRef} className="w-full flex-1 flex flex-col items-center justify-start z-10 px-2 space-y-4 sm:space-y-6 overflow-y-auto scrollbar-hide pb-4">
                                {currentExercise.steps.slice(0, step + 1).map((s, idx) => (
                                    <div key={`${exIdx}-${idx}`} className={`transition-all duration-300 w-full max-w-3xl flex flex-col items-center ${idx === step ? 'opacity-100 scale-100 animate-slideInRight' : 'opacity-60 scale-95'}`}>
                                        
                                        <div className={`px-4 py-3 sm:px-8 sm:py-4 w-fit max-w-full text-center rounded-[1.5rem] sm:rounded-[2rem] flex items-center justify-center min-h-[4rem] sm:min-h-[5rem] overflow-x-auto scrollbar-hide ${
                                            idx === step 
                                            ? (step === maxSteps ? 'bg-[#fde047] border-[4px] sm:border-[6px] border-[#eab308] shadow-[0_15px_30px_rgba(234,179,8,0.5)] math-current' : 'bg-white border-[4px] sm:border-[6px] border-blue-400 shadow-[0_10px_25px_rgba(59,130,246,0.3)] math-current') 
                                            : 'bg-white/70 border-[2px] sm:border-[3px] border-slate-200 math-history'
                                        }`}>
                                            <MathDisplay latex={s.latex} />
                                        </div>
                                        
                                        {/* Gráfico/Tarjeta interactiva opcional si existe en el paso */}
                                        {s.graphic && (
                                            <div className={`mt-4 w-full max-w-xl transition-all ${idx === step ? 'opacity-100' : 'opacity-70'}`}>
                                                {s.graphic}
                                            </div>
                                        )}
                                    </div>
                                ))}
                            </div>
                        </div>

                        {/* Zona Inferior: Robot y Feedback */}
                        <div className="shrink-0 bg-white w-full px-4 py-2 sm:px-8 sm:py-3 flex items-center gap-4 sm:gap-6 border-t-[4px] border-slate-100 z-20 relative shadow-[0_-10px_20px_rgba(0,0,0,0.05)]">
                            <div className="shrink-0 absolute -top-12 sm:relative sm:-top-0 left-4 sm:left-0 drop-shadow-xl">
                                <RobotAssistant step={step} maxSteps={maxSteps} />
                            </div>
                            <div className="flex-1 text-sm sm:text-base md:text-lg font-bold text-slate-700 leading-snug sm:leading-relaxed bg-blue-50/80 p-3 sm:p-4 rounded-[1rem] border-2 border-blue-100 min-h-[4rem] flex items-center shadow-sm ml-[4.5rem] sm:ml-0">
                                <div key={`speech-${exIdx}-${step}`} className="animate-slideInRight w-full">
                                    {currentStepData.robotSpeech}
                                </div>
                            </div>
                        </div>

                        {/* Controles Nav */}
                        <div className="shrink-0 bg-gradient-to-b from-[#e0e7ff] to-[#c7d2fe] p-2 sm:p-3 w-full flex flex-col items-center border-t-[4px] border-white z-20">
                            <div className="flex justify-center items-stretch w-full max-w-4xl gap-2 sm:gap-4 h-10 sm:h-12">
                                <button
                                    onClick={prevStep}
                                    disabled={step === 0}
                                    className="flex-[0.8] bg-[#a5b4fc] border-b-[4px] border-[#6366f1] text-[#312e81] rounded-l-xl font-black text-sm sm:text-lg flex items-center justify-center gap-1 active:border-b-0 active:translate-y-[4px] disabled:opacity-40 transition-all hover:bg-[#c7d2fe]"
                                >
                                    <ChevronLeft className="w-5 h-5 sm:w-6 sm:h-6 stroke-[3px]" />
                                    <span className="hidden sm:inline">Atrás</span>
                                </button>

                                <div className="bg-[#6366f1] text-white font-black px-3 sm:px-6 text-sm sm:text-xl flex items-center justify-center border-b-[4px] border-[#4338ca] shadow-inner whitespace-nowrap min-w-[4rem]">
                                    Paso {step + 1}/{maxSteps + 1}
                                </div>

                                <button
                                    onClick={nextStep}
                                    className={`flex-[2] border-b-[4px] text-white rounded-r-xl font-black text-sm sm:text-xl flex items-center justify-center gap-2 active:border-b-0 active:translate-y-[4px] transition-all shadow-sm hover:brightness-110 ${
                                        step === maxSteps
                                            ? 'bg-gradient-to-r from-[#10b981] to-[#047857] border-[#065f46] animate-pulse'
                                            : 'bg-gradient-to-r from-[#3b82f6] to-[#2563eb] border-[#1d4ed8]'
                                    }`}
                                >
                                    <span>
                                        {step < maxSteps
                                            ? '¡Siguiente Paso!'
                                            : exIdx < EXERCISES.length - 1
                                            ? `Siguiente Reto`
                                            : '¡Volver!'}
                                    </span>
                                    <ChevronRight className="w-5 h-5 sm:w-6 sm:h-6 stroke-[3px]" />
                                </button>
                            </div>
                        </div>
                    </div>
                </div>
            );
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
